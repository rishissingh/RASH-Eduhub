<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Student Profile - RASH EduHub</title>

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <link rel="stylesheet" href="../css/style.css">
</head>
<body>

   <header class="header"></header>
   <div class="side-bar"></div>

   <section style="min-height: 80vh; padding: 4rem 2rem;">
      <div class="glass-card-deep" style="max-width: 60rem; margin: 0 auto; padding: 4rem 3rem; border-radius: 2.4rem;">
         <h2 style="font-size: 2.8rem; margin-bottom: 2.5rem; text-align: center; background: var(--main-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            Student Profile Settings
         </h2>

         <form id="student-profile-form">
            <div class="form-group">
               <label>Full Name</label>
               <div class="input-icon-wrapper">
                  <i class="fas fa-user input-icon"></i>
                  <input type="text" name="name" class="form-input" required>
               </div>
            </div>

            <div class="form-group">
               <label>Email Address (Read-Only)</label>
               <div class="input-icon-wrapper">
                  <i class="fas fa-envelope input-icon"></i>
                  <input type="email" name="email" class="form-input" disabled style="opacity: 0.7;">
               </div>
            </div>

            <div class="form-group">
               <label>About Bio</label>
               <textarea name="bio" class="form-input" placeholder="Tell instructors about your learning goals..."></textarea>
            </div>

            <button type="submit" class="btn" style="margin-top: 1rem;"><i class="fas fa-save"></i> Save Profile Changes</button>
         </form>
      </div>
   </section>

   <footer class="footer">
      <p style="font-size: 1.5rem; color: var(--light-color);">&copy; 2026 <strong>RASH EduHub</strong>. All rights reserved.</p>
   </footer>

   <!-- Core Services -->
   <script src="../js/services/db.js"></script>
   <script src="../js/services/authService.js"></script>
   <script src="../js/services/courseService.js"></script>
   <script src="../js/services/userService.js"></script>

   <!-- Components -->
   <script src="../js/theme.js"></script>
   <script src="../js/components/navbar.js"></script>
   <script src="../js/components/sidebar.js"></script>
   <script src="../js/pages/studentDashboard.js"></script>
</body>
</html>
