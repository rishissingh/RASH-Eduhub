<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Learning Interface & Real Groq AI Assistant - RASH EduHub</title>

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <link rel="stylesheet" href="../css/style.css">
</head>
<body>

   <header class="header"></header>
   <div class="side-bar"></div>

   <section style="padding: 3rem 2rem;">
      <div style="display: grid; grid-template-columns: 2.5fr 1fr; gap: 3rem; align-items: start;">
         
         <!-- Main Video Player & AI Assistant -->
         <div>
            <div id="video-player-container"></div>

            <!-- Real Groq AI Teacher Assistant Component -->
            <div class="glass-card" style="margin-top: 3rem; padding: 2.5rem; border-radius: 2rem;">
               <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: var(--border);">
                  <div style="display: flex; align-items: center; gap: 1.2rem;">
                     <div style="height: 4rem; width: 4rem; border-radius: 50%; background: var(--main-gradient); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.8rem;">
                        <i class="fas fa-robot"></i>
                     </div>
                     <div>
                        <h3 style="font-size: 2rem; margin: 0; color: var(--black);">Real Groq AI Teacher Assistant</h3>
                        <span style="font-size: 1.2rem; color: var(--light-color);">Model: llama-3.3-70b-versatile &bull; Live Streaming</span>
                     </div>
                  </div>

                  <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                     <button id="ai-regenerate-btn" class="chip" style="font-size: 1.3rem; padding: 0.6rem 1.2rem;" title="Regenerate Last Answer">
                        <i class="fas fa-rotate"></i> Regenerate
                     </button>
                     <button id="ai-export-btn" class="option-btn" style="width: auto; font-size: 1.3rem; padding: 0.6rem 1.2rem;" title="Export Notes">
                        <i class="fas fa-download"></i> Export Notes
                     </button>
                     <button id="ai-clear-btn" class="delete-btn" style="width: auto; font-size: 1.3rem; padding: 0.6rem 1.2rem;" title="Clear Chat">
                        <i class="fas fa-trash"></i> Clear Chat
                     </button>
                  </div>
               </div>

               <!-- Groq API Key Configuration Drawer -->
               <div style="margin-bottom: 2rem; padding: 1.5rem; background: var(--light-bg); border-radius: 1.2rem; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap;">
                  <div style="display: flex; align-items: center; gap: 1rem; flex: 1; min-width: 25rem;">
                     <i class="fas fa-key" style="font-size: 1.8rem; color: var(--main-color);"></i>
                     <input type="password" id="groq-key-input" class="form-input" placeholder="Paste your Groq API Key (gsk_...)" style="font-size: 1.3rem; padding: 0.8rem 1.2rem;">
                  </div>
                  <button id="save-groq-key-btn" class="btn" style="width: auto; font-size: 1.3rem; padding: 0.8rem 1.8rem;">
                     Save Groq Key
                  </button>
               </div>

               <!-- Quick AI Preset Prompt Chips -->
               <div style="display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 2rem;">
                  <button class="chip ai-prompt-chip" data-prompt="What is HTML? Explain with definition, example, code, and common mistakes.">💡 Explain HTML</button>
                  <button class="chip ai-prompt-chip" data-prompt="What is Time Complexity? Explain with Big O notation, code example, and interview questions.">⏱️ Time Complexity</button>
                  <button class="chip ai-prompt-chip" data-prompt="What is CSS? Explain selectors, box model, and code example.">🎨 Explain CSS</button>
                  <button class="chip ai-prompt-chip" data-prompt="Generate 3 practice MCQs with answers for this lesson.">📝 Practice MCQs</button>
                  <button class="chip ai-prompt-chip" data-prompt="Explain this concept in simple Hindi / Hinglish language.">🇮🇳 Hindi Explanation</button>
                  <button class="chip ai-prompt-chip" data-prompt="Generate revision cheat sheet notes for this lesson.">⚡ Cheat Sheet</button>
               </div>

               <!-- Messages Scroll Window -->
               <div id="ai-chat-messages" style="min-height: 25rem; max-height: 50rem; overflow-y: auto; padding: 1rem 0; margin-bottom: 2rem;"></div>

               <!-- Input Bar -->
               <div style="display: flex; gap: 1.2rem;">
                  <input type="text" id="ai-chat-input" class="form-input" placeholder="Ask your AI Teacher any question (e.g. What is HTML?, What is Time Complexity?)..." style="flex: 1;">
                  <button id="ai-send-btn" class="btn" style="width: auto; padding: 0 2.5rem;">
                     <i class="fas fa-paper-plane"></i> Ask AI
                  </button>
               </div>
            </div>

            <!-- Tabbed Lesson Information -->
            <div class="glass-card" style="margin-top: 3rem; padding: 2.5rem; border-radius: 2rem;">
               <div style="display: flex; gap: 1.5rem; border-bottom: var(--border); padding-bottom: 1.5rem; margin-bottom: 2rem;">
                  <button class="chip tab-btn active" data-target="tab-overview-content">Lesson Overview</button>
                  <button class="chip tab-btn" data-target="tab-notes-content">PDF Notes & Resources</button>
                  <button class="chip tab-btn" data-target="tab-comments-content">Student Discussion</button>
               </div>

               <div id="tab-overview-content" class="tab-content" style="display: block;"></div>
               <div id="tab-notes-content" class="tab-content" style="display: none;"></div>
               <div id="tab-comments-content" class="tab-content" style="display: none;">
                  <div id="comments-list"></div>
               </div>
            </div>
         </div>

         <!-- Playlist Sidebar -->
         <div id="playlist-sidebar-container" style="position: sticky; top: 9rem;"></div>
      </div>
   </section>

   <footer class="footer" style="text-align: center; padding: 3rem; background: var(--glass-bg); border-top: var(--border); margin-top: 5rem;">
      <p style="font-size: 1.6rem; color: var(--light-color);">&copy; 2026 <strong>RASH EduHub</strong>. All rights reserved.</p>
   </footer>

   <!-- Core Services -->
   <script src="../js/services/db.js"></script>
   <script src="../js/services/authService.js"></script>
   <script src="../js/services/courseService.js"></script>
   <script src="../js/services/userService.js"></script>
   <script src="../js/services/aiService.js"></script>
   <script src="../js/services/videoStorageService.js"></script>

   <!-- Components -->
   <script src="../js/theme.js"></script>
   <script src="../js/components/navbar.js"></script>
   <script src="../js/components/sidebar.js"></script>
   <script src="../js/pages/watchVideo.js"></script>
</body>
</html>
