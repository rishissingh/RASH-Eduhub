<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Explore Courses - RASH EduHub</title>

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <link rel="stylesheet" href="css/style.css">
</head>
<body>

   <header class="header"></header>
   <div class="side-bar"></div>

   <section class="courses">
      <h1 class="heading">Explore Premium Courses</h1>

      <!-- Search & Filter Controls -->
      <div class="glass-card" style="padding: 2.5rem; margin-bottom: 3.5rem; border-radius: 2rem;">
         <div style="display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 2rem;">
            <div style="flex: 1 1 30rem; position: relative;">
               <input type="text" id="course-search-input" class="form-input" placeholder="Search courses, topics, or teachers..." style="padding-left: 4.5rem;">
               <i class="fas fa-search" style="position: absolute; left: 1.8rem; top: 50%; transform: translateY(-50%); font-size: 1.8rem; color: var(--light-color);"></i>
            </div>

            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
               <select id="filter-level" class="form-input" style="width: auto;">
                  <option value="All">All Skill Levels</option>
                  <option value="Beginner">Beginner</option>
                  <option value="Intermediate">Intermediate</option>
                  <option value="Advanced">Advanced</option>
               </select>

               <select id="filter-price" class="form-input" style="width: auto;">
                  <option value="All">All Prices</option>
                  <option value="Free">Free Courses</option>
                  <option value="Paid">Paid Courses</option>
               </select>

               <select id="filter-sort" class="form-input" style="width: auto;">
                  <option value="popular">Sort by Popularity</option>
                  <option value="rating">Sort by Top Rated</option>
                  <option value="newest">Sort by Newest</option>
               </select>
            </div>
         </div>

         <!-- Category Filter Chips -->
         <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <button class="chip category-chip active" data-category="All">All Categories</button>
            <button class="chip category-chip" data-category="Development">Development</button>
            <button class="chip category-chip" data-category="Python">Python & Data</button>
            <button class="chip category-chip" data-category="DSA">DSA & Coding</button>
            <button class="chip category-chip" data-category="Design">UI/UX Design</button>
         </div>
      </div>

      <!-- Courses Catalog Grid -->
      <div class="box-container" id="courses-catalog-grid"></div>
   </section>

   <footer class="footer" style="text-align: center; padding: 3rem; background: var(--glass-bg); border-top: var(--border); margin-top: 5rem;">
      <p style="font-size: 1.6rem; color: var(--light-color);">&copy; 2026 <strong>RASH EduHub</strong>. All rights reserved.</p>
   </footer>

   <!-- Core Services -->
   <script src="js/services/db.js"></script>
   <script src="js/services/authService.js"></script>
   <script src="js/services/courseService.js"></script>
   <script src="js/services/userService.js"></script>

   <!-- Components -->
   <script src="js/theme.js"></script>
   <script src="js/components/navbar.js"></script>
   <script src="js/components/sidebar.js"></script>
   <script src="js/pages/coursesPage.js"></script>
</body>
</html>
