<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Instructors - RASH EduHub</title>

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <link rel="stylesheet" href="css/style.css">
</head>
<body>

   <header class="header"></header>
   <div class="side-bar"></div>

   <section class="teachers">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
         <div>
            <h1 class="heading" style="margin-bottom: 0.5rem; border-bottom: none; padding-bottom: 0;">Our Expert Instructors</h1>
            <p style="font-size: 1.5rem; color: var(--light-color);">Learn directly from industry leaders and certified specialists.</p>
         </div>
      </div>

      <div class="box-container" id="all-teachers-container" style="grid-template-columns: repeat(auto-fit, minmax(28rem, 1fr)); gap: 2.5rem;">
         <!-- Populated dynamically via UserService.getInstructors() -->
      </div>
   </section>

   <footer class="footer" style="text-align: center; padding: 3rem; background: var(--glass-bg); border-top: var(--border); margin-top: 5rem;">
      <p style="font-size: 1.6rem; color: var(--light-color);">&copy; 2026 <strong>RASH EduHub</strong>. All rights reserved.</p>
   </footer>

   <!-- Core Services -->
   <script src="js/services/db.js"></script>
   <script src="js/services/authService.js"></script>
   <script src="js/services/courseService.js"></script>
   <script src="js/services/userService.js"></script>

   <!-- Components -->
   <script src="js/theme.js"></script>
   <script src="js/components/navbar.js"></script>
   <script src="js/components/sidebar.js"></script>

   <script>
      document.addEventListener('DOMContentLoaded', async () => {
         const container = document.querySelector('#all-teachers-container');
         if (!container) return;

         container.innerHTML = `
            <div class="box glass-card skeleton-card" style="padding: 3rem 2rem; text-align: center;">
               <div class="skeleton" style="height: 11rem; width: 11rem; border-radius: 50%; margin: 0 auto 1.5rem auto;"></div>
               <div class="skeleton" style="height: 2.2rem; width: 60%; margin: 0 auto 0.8rem auto; border-radius: 0.5rem;"></div>
               <div class="skeleton" style="height: 1.5rem; width: 40%; margin: 0 auto 1.5rem auto; border-radius: 0.5rem;"></div>
               <div class="skeleton" style="height: 4rem; width: 80%; margin: 0 auto; border-radius: 0.8rem;"></div>
            </div>
            <div class="box glass-card skeleton-card" style="padding: 3rem 2rem; text-align: center;">
               <div class="skeleton" style="height: 11rem; width: 11rem; border-radius: 50%; margin: 0 auto 1.5rem auto;"></div>
               <div class="skeleton" style="height: 2.2rem; width: 60%; margin: 0 auto 0.8rem auto; border-radius: 0.5rem;"></div>
               <div class="skeleton" style="height: 1.5rem; width: 40%; margin: 0 auto 1.5rem auto; border-radius: 0.5rem;"></div>
               <div class="skeleton" style="height: 4rem; width: 80%; margin: 0 auto; border-radius: 0.8rem;"></div>
            </div>
            <div class="box glass-card skeleton-card" style="padding: 3rem 2rem; text-align: center;">
               <div class="skeleton" style="height: 11rem; width: 11rem; border-radius: 50%; margin: 0 auto 1.5rem auto;"></div>
               <div class="skeleton" style="height: 2.2rem; width: 60%; margin: 0 auto 0.8rem auto; border-radius: 0.5rem;"></div>
               <div class="skeleton" style="height: 1.5rem; width: 40%; margin: 0 auto 1.5rem auto; border-radius: 0.5rem;"></div>
               <div class="skeleton" style="height: 4rem; width: 80%; margin: 0 auto; border-radius: 0.8rem;"></div>
            </div>
         `;

         try {
            const instructors = await UserService.getInstructors();
            if (!instructors || instructors.length === 0) {
               container.innerHTML = `
                  <div class="glass-card text-center" style="padding: 4rem 2rem; grid-column: 1 / -1;">
                     <i class="fas fa-chalkboard-user" style="font-size: 4rem; color: var(--light-color); margin-bottom: 1.5rem;"></i>
                     <h3 style="font-size: 2.2rem; color: var(--black); margin-bottom: 0.8rem;">No Active Instructors Available</h3>
                     <p style="font-size: 1.45rem; color: var(--light-color);">Check back shortly as our mentors publish new content.</p>
                  </div>
               `;
               return;
            }

            container.innerHTML = instructors.map(instructor => {
               const avatar = instructor.avatar || 'images/pic-1.jpg';
               const expBadge = instructor.experience 
                  ? `<span class="badge badge-teacher" style="font-size: 1.2rem; padding: 0.4rem 1rem;"><i class="fas fa-briefcase"></i> ${instructor.experience}</span>`
                  : '';
               const courseCountBadge = `
                  <span class="badge badge-accent" style="font-size: 1.2rem; padding: 0.4rem 1rem;">
                     <i class="fas fa-book-open"></i> ${instructor.coursesCount} ${instructor.coursesCount === 1 ? 'Course' : 'Courses'}
                  </span>
               `;
               const bio = instructor.bio 
                  ? `<p style="font-size: 1.35rem; color: var(--light-color); line-height: 1.6; margin-bottom: 2rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">${instructor.bio}</p>`
                  : '';

               return `
                  <div class="box glass-card hover-lift" style="display: flex; flex-direction: column; justify-content: space-between; text-align: center; padding: 3rem 2.2rem; border-radius: 2rem;">
                     <div>
                        <div style="position: relative; width: 11rem; height: 11rem; margin: 0 auto 1.6rem auto;">
                           <img src="${avatar}" alt="${instructor.name}" onerror="this.onerror=null; this.src='images/pic-1.jpg';" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3.5px solid var(--main-color); box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);">
                           <span style="position: absolute; bottom: 0.2rem; right: 0.4rem; background: var(--green); width: 1.8rem; height: 1.8rem; border-radius: 50%; border: 3px solid var(--white);" title="Active Instructor"></span>
                        </div>
                        <h3 style="font-size: 2.2rem; color: var(--black); margin-bottom: 0.4rem; font-weight: 700;">${instructor.name}</h3>
                        <p style="font-size: 1.4rem; color: var(--main-color); font-weight: 600; margin-bottom: 1.2rem;">${instructor.specialization || instructor.title || 'Course Instructor'}</p>
                        <div style="display: flex; gap: 0.8rem; justify-content: center; align-items: center; flex-wrap: wrap; margin-bottom: 1.5rem;">
                           ${courseCountBadge}
                           ${expBadge}
                        </div>
                        ${bio}
                     </div>
                     <div style="margin-top: auto; padding-top: 1rem;">
                        <a href="teacher_profile.html?teacherId=${encodeURIComponent(instructor.id)}" class="btn" style="width: 100%; text-align: center; font-weight: 600;">
                           <i class="fas fa-graduation-cap"></i> View Instructor Courses
                        </a>
                     </div>
                  </div>
               `;
            }).join('');
         } catch (err) {
            container.innerHTML = `<div class="glass-card text-center" style="padding: 3rem; grid-column: 1 / -1;"><p style="font-size: 1.5rem; color: var(--red);">Failed to load instructors.</p></div>`;
         }
      });
   </script>
</body>
</html>
