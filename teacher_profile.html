<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Instructor Profile - RASH EduHub</title>

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <link rel="stylesheet" href="css/style.css">
</head>
<body>

   <header class="header"></header>
   <div class="side-bar"></div>

   <section class="teacher-profile">
      <!-- Dynamic instructor profile -->
      <div id="teacher-profile-container"></div>
   </section>

   <section class="courses">
      <h1 class="heading">Published Courses</h1>
      <div class="box-container" id="teacher-courses-container"></div>
   </section>

   <footer class="footer" style="text-align: center; padding: 3rem; background: var(--glass-bg); border-top: var(--border); margin-top: 5rem;">
      <p style="font-size: 1.6rem; color: var(--light-color);">&copy; 2026 <strong>RASH EduHub</strong>. All rights reserved.</p>
   </footer>

   <!-- Core Services -->
   <script src="js/services/db.js"></script>
   <script src="js/services/authService.js"></script>
   <script src="js/services/courseService.js"></script>
   <script src="js/services/userService.js"></script>

   <!-- Components -->
   <script src="js/theme.js"></script>
   <script src="js/components/navbar.js"></script>
   <script src="js/components/sidebar.js"></script>

   <script>
      document.addEventListener('DOMContentLoaded', async () => {
         const urlParams = new URLSearchParams(window.location.search);
         const teacherId = urlParams.get('teacherId') || 'teacher-1';

         const teachers = await UserService.getUsersByRole('teacher');
         const teacher = teachers.find(t => t.id === teacherId || t._id === teacherId) || teachers[0] || {
            name: 'Harsh Singh',
            role: 'teacher',
            avatar: 'images/pic-1.jpg',
            bio: 'Senior Full-Stack Architect & AI Educator'
         };

         const profileContainer = document.querySelector('#teacher-profile-container');
         if (profileContainer) {
            profileContainer.innerHTML = `
               <h1 class="heading">Instructor Profile</h1>
               <div class="glass-card" style="padding: 3.5rem; border-radius: 2.4rem; margin-bottom: 3.5rem;">
                  <div style="display: flex; align-items: center; gap: 2.5rem; flex-wrap: wrap;">
                     <img src="${teacher.avatar || 'images/pic-1.jpg'}" alt="${teacher.name}" style="height: 12rem; width: 12rem; border-radius: 50%; object-fit: cover; border: 4px solid var(--main-color);">
                     <div style="flex: 1;">
                        <h2 style="font-size: 2.8rem; color: var(--black); margin-bottom: 0.5rem;">${teacher.name}</h2>
                        <span class="badge badge-teacher" style="margin-bottom: 1rem;">Senior Instructor</span>
                        <p style="font-size: 1.5rem; color: var(--light-color); margin-top: 1rem;">${teacher.bio || 'Experienced software mentor dedicated to practical tech education.'}</p>
                     </div>
                  </div>
               </div>
            `;
         }

         const allCourses = await CourseService.getAllCourses();
         const teacherCourses = allCourses.filter(c => c.teacherName === teacher.name || c.teacherId === teacher.id || c.teacherId === teacher._id);
         const coursesContainer = document.querySelector('#teacher-courses-container');

         if (coursesContainer) {
            if (teacherCourses.length === 0) {
               coursesContainer.innerHTML = `
                  <div class="glass-card text-center" style="padding: 4rem; grid-column: 1 / -1;">
                     <p style="font-size: 1.6rem; color: var(--light-color);">No courses published by this instructor yet.</p>
                  </div>
               `;
               return;
            }

            coursesContainer.innerHTML = teacherCourses.map(c => `
               <div class="box glass-card hover-lift">
                  <div class="thumb img-zoom" style="height: 18rem; overflow: hidden; border-radius: 1rem; margin-bottom: 1.5rem;">
                     <img src="${c.thumbnail}" alt="${c.title}">
                  </div>
                  <h3 class="title" style="font-size: 1.8rem; color: var(--black);">${c.title}</h3>
                  <a href="playlist.html?courseId=${c.id || c._id}" class="inline-btn" style="width: 100%; text-align: center; margin-top: 1rem;">
                     View Playlist
                  </a>
               </div>
            `).join('');
         }
      });
   </script>
</body>
</html>
