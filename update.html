<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Update Profile - RASH EduHub</title>

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <link rel="stylesheet" href="css/style.css">
</head>
<body>

   <header class="header"></header>
   <div class="side-bar"></div>

   <section style="min-height: 80vh; padding: 4rem 2rem;">
      <div class="glass-card" style="max-width: 55rem; margin: 0 auto; padding: 4rem 3rem; border-radius: 2.4rem;">
         <h2 style="font-size: 2.8rem; margin-bottom: 0.8rem; text-align: center; background: var(--main-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            Update Profile Information
         </h2>
         <p style="font-size: 1.5rem; color: var(--light-color); text-align: center; margin-bottom: 3rem;">Update your account name, bio, and preferences</p>

         <form id="update-profile-form">
            <div class="form-group">
               <label>Full Name</label>
               <input type="text" name="name" class="form-input" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
               <label>Email Address</label>
               <input type="email" name="email" class="form-input" disabled style="opacity: 0.7;" placeholder="Your email address">
            </div>

            <div class="form-group">
               <label>About / Bio</label>
               <textarea name="bio" class="form-input" placeholder="Tell the community about yourself..." style="min-height: 9rem;"></textarea>
            </div>

            <button type="submit" class="btn" style="margin-top: 1rem;"><i class="fas fa-save"></i> Save Profile Changes</button>
         </form>
      </div>
   </section>

   <footer class="footer" style="text-align: center; padding: 3rem; background: var(--glass-bg); border-top: var(--border); margin-top: 5rem;">
      <p style="font-size: 1.6rem; color: var(--light-color);">&copy; 2026 <strong>RASH EduHub</strong>. All rights reserved.</p>
   </footer>

   <!-- Core Services -->
   <script src="js/services/db.js"></script>
   <script src="js/services/authService.js"></script>
   <script src="js/services/courseService.js"></script>
   <script src="js/services/userService.js"></script>

   <!-- Components -->
   <script src="js/theme.js"></script>
   <script src="js/components/navbar.js"></script>
   <script src="js/components/sidebar.js"></script>
   <script>
      document.addEventListener('DOMContentLoaded', () => {
         const user = AuthService.getCurrentUser();
         if (!user) {
            window.location.href = 'login.html';
            return;
         }

         const form = document.querySelector('#update-profile-form');
         if (form) {
            form.querySelector('[name="name"]').value = user.name || '';
            form.querySelector('[name="email"]').value = user.email || '';
            form.querySelector('[name="bio"]').value = user.bio || '';

            form.addEventListener('submit', async (e) => {
               e.preventDefault();
               const name = form.querySelector('[name="name"]').value;
               const bio = form.querySelector('[name="bio"]').value;

               const res = await UserService.updateProfile({ name, bio });
               if (res.success) {
                  if (window.Toast) window.Toast.success('Profile updated successfully!', 'Saved');
                  setTimeout(() => {
                     window.location.href = 'profile.html';
                  }, 800);
               } else {
                  if (window.Toast) window.Toast.error(res.message || 'Update failed', 'Error');
               }
            });
         }
      });
   </script>
</body>
</html>
