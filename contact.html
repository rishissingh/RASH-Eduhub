<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Contact Support - RASH EduHub</title>

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <link rel="stylesheet" href="css/style.css">
</head>
<body>

   <header class="header"></header>
   <div class="side-bar"></div>

   <section style="min-height: 80vh; padding: 4rem 2rem;">
      <div class="glass-card" style="max-width: 65rem; margin: 0 auto; padding: 4rem 3rem; border-radius: 2.4rem;">
         <h2 style="font-size: 2.8rem; margin-bottom: 0.8rem; text-align: center; background: var(--main-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            Get in Touch With Us
         </h2>
         <p style="font-size: 1.5rem; color: var(--light-color); text-align: center; margin-bottom: 3rem;">
            Have questions about courses, teacher onboarding, or platform features? Send us a message!
         </p>

         <form id="contact-form">
            <div class="form-group">
               <label>Your Full Name</label>
               <input type="text" name="name" class="form-input" placeholder="enter your name" required>
            </div>

            <div class="form-group">
               <label>Email Address</label>
               <input type="email" name="email" class="form-input" placeholder="enter your email" required>
            </div>

            <div class="form-group">
               <label>Your Message</label>
               <textarea name="msg" class="form-input" placeholder="type your message here..." required></textarea>
            </div>

            <button type="submit" class="btn" style="margin-top: 1rem;"><i class="fas fa-paper-plane"></i> Send Message</button>
         </form>
      </div>
   </section>

   <footer class="footer" style="text-align: center; padding: 3rem; background: var(--glass-bg); border-top: var(--border); margin-top: 5rem;">
      <p style="font-size: 1.6rem; color: var(--light-color);">&copy; 2026 <strong>RASH EduHub</strong>. All rights reserved.</p>
   </footer>

   <!-- Core Services -->
   <script src="js/services/db.js"></script>
   <script src="js/services/authService.js"></script>
   <script src="js/services/courseService.js"></script>
   <script src="js/services/userService.js"></script>

   <!-- Components -->
   <script src="js/theme.js"></script>
   <script src="js/components/navbar.js"></script>
   <script src="js/components/sidebar.js"></script>
   <script src="js/contact.js"></script>
</body>
</html>
