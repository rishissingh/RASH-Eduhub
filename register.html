<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Create Account - RASH EduHub</title>

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <link rel="stylesheet" href="css/style.css">

   <!-- Google Identity Services -->
   <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

   <header class="header"></header>
   <div class="side-bar"></div>

   <section style="min-height: 85vh; display: flex; align-items: center; justify-content: center; padding: 4rem 2rem;">
      <div class="glass-card google-auth-card" style="width: 100%; max-width: 54rem; padding: 4rem 3rem; border-radius: 2.4rem;">
         
         <div style="text-align: center; margin-bottom: 3rem;">
             <a href="index.html" style="display: block; text-align: center; text-decoration: none;">
                <img src="images/logo.png" alt="RASH EduHub" class="auth-brand-logo">
             </a>
             <h2 style="font-size: 2.8rem; margin-bottom: 0.8rem; color: var(--black);">
                Join RASH EduHub
             </h2>
             <p style="font-size: 1.5rem; color: var(--light-color);">Select your account role, then sign up with Google</p>
          </div>

         <!-- Role Selector Cards -->
         <div class="form-group" style="margin-bottom: 2.5rem;">
            <label style="font-size: 1.5rem; font-weight: 600; margin-bottom: 1rem; display: block; color: var(--black);">Choose Account Type</label>
            <div class="role-select-grid">
               <div class="role-card active" data-role="student" id="reg-role-student">
                  <input type="radio" name="role" value="student" checked>
                  <i class="fas fa-user-graduate"></i>
                  <span>Student</span>
                  <p>Learn & practice challenge assignments</p>
               </div>

               <div class="role-card" data-role="teacher" id="reg-role-teacher">
                  <input type="radio" name="role" value="teacher">
                  <i class="fas fa-chalkboard-user"></i>
                  <span>Teacher</span>
                  <p>Upload videos, quizzes & grade challenges</p>
               </div>
            </div>
         </div>

         <!-- Google Sign-Up Button -->
         <div class="google-signin-wrapper">
            <div id="google-signup-btn"></div>
         </div>

         <div style="text-align: center; margin-top: 2.5rem; font-size: 1.5rem; color: var(--light-color);">
            Already have an account? <a href="login.html" style="color: var(--main-color); font-weight: 600;">Sign In</a>
         </div>
      </div>
   </section>

   <footer class="footer">
      <p style="font-size: 1.5rem; color: var(--light-color);">&copy; 2026 <strong>RASH EduHub</strong>. All rights reserved.</p>
   </footer>

   <!-- Core Service Scripts -->
   <script src="js/services/db.js"></script>
   <script src="js/services/googleConfig.js"></script>
   <script src="js/services/authService.js"></script>
   <script src="js/services/courseService.js"></script>
   <script src="js/services/userService.js"></script>

   <!-- Component Scripts -->
   <script src="js/theme.js"></script>
   <script src="js/components/navbar.js"></script>
   <script src="js/components/sidebar.js"></script>
   <script src="js/pages/authPage.js"></script>
</body>
</html>
